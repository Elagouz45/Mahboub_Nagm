<app-auth-shell title="إنشاء حساب جديد" lead="أنشئ حسابك لمتابعة طلباتك وحفظ منتجاتك المفضلة.">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (formError()) {
      <p class="auth-form__error" role="alert" aria-live="assertive">{{ formError() }}</p>
    }

    <div class="names">
      <label [class.is-invalid]="fieldInvalid('firstName')">
        <span>الاسم الأول</span>
        <input
          id="register-first-name"
          type="text"
          formControlName="firstName"
          autocomplete="given-name"
          [attr.aria-invalid]="fieldInvalid('firstName')"
          [attr.aria-describedby]="fieldInvalid('firstName') ? 'register-first-name-error' : null"
        />
        @if (fieldInvalid('firstName')) {
          <small id="register-first-name-error">الاسم الأول مطلوب.</small>
        }
      </label>
      <label [class.is-invalid]="fieldInvalid('lastName')">
        <span>اسم العائلة</span>
        <input
          id="register-last-name"
          type="text"
          formControlName="lastName"
          autocomplete="family-name"
          [attr.aria-invalid]="fieldInvalid('lastName')"
          [attr.aria-describedby]="fieldInvalid('lastName') ? 'register-last-name-error' : null"
        />
        @if (fieldInvalid('lastName')) {
          <small id="register-last-name-error">اسم العائلة مطلوب.</small>
        }
      </label>
    </div>

    <label [class.is-invalid]="fieldInvalid('phone')">
      <span>رقم الهاتف</span>
      <input
        id="register-phone"
        type="tel"
        formControlName="phone"
        autocomplete="tel"
        inputmode="tel"
        [attr.aria-invalid]="fieldInvalid('phone')"
        [attr.aria-describedby]="fieldInvalid('phone') ? 'register-phone-error' : null"
      />
      @if (fieldInvalid('phone')) {
        <small id="register-phone-error">
          {{
            form.controls.phone.hasError('duplicate')
              ? 'يوجد حساب مسجل بهذه البيانات بالفعل.'
              : 'أدخل رقمًا مصريًا صحيحًا.'
          }}
        </small>
      }
    </label>

    <label [class.is-invalid]="fieldInvalid('email')">
      <span>البريد الإلكتروني</span>
      <input
        id="register-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        [attr.aria-invalid]="fieldInvalid('email')"
        [attr.aria-describedby]="fieldInvalid('email') ? 'register-email-error' : null"
      />
      @if (fieldInvalid('email')) {
        <small id="register-email-error">
          {{
            form.controls.email.hasError('duplicate')
              ? 'يوجد حساب مسجل بهذه البيانات بالفعل.'
              : 'أدخل بريدًا إلكترونيًا صحيحًا.'
          }}
        </small>
      }
    </label>

    <label [class.is-invalid]="fieldInvalid('password')">
      <span>كلمة المرور</span>
      <span class="password-field">
        <input
          id="register-password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
          [attr.aria-invalid]="fieldInvalid('password')"
          [attr.aria-describedby]="fieldInvalid('password') ? 'register-password-error' : null"
        />
        <button
          type="button"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"
        >
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
        </button>
      </span>
      @if (fieldInvalid('password')) {
        <small id="register-password-error">ثماني أحرف على الأقل، حرف واحد ورقم واحد.</small>
      }
    </label>

    <label [class.is-invalid]="fieldInvalid('confirmPassword')">
      <span>تأكيد كلمة المرور</span>
      <input
        id="register-confirm-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [attr.aria-invalid]="fieldInvalid('confirmPassword')"
        [attr.aria-describedby]="fieldInvalid('confirmPassword') ? 'register-confirm-error' : null"
      />
      @if (fieldInvalid('confirmPassword')) {
        <small id="register-confirm-error">كلمتا المرور غير متطابقتين.</small>
      }
    </label>

    <label class="check-row" [class.is-invalid]="fieldInvalid('terms')">
      <input
        id="register-terms"
        type="checkbox"
        formControlName="terms"
        [attr.aria-invalid]="fieldInvalid('terms')"
        [attr.aria-describedby]="fieldInvalid('terms') ? 'register-terms-error' : null"
      />
      <span>
        أوافق على الشروط وسياسة الخصوصية
        (<a routerLink="/privacy-policy">سياسة الخصوصية</a>)
      </span>
    </label>
    @if (fieldInvalid('terms')) {
      <small id="register-terms-error" class="auth-form__error">يجب الموافقة على الشروط وسياسة الخصوصية.</small>
    }

    <button type="submit" class="auth-form__submit" [disabled]="submitting()">
      {{ submitting() ? 'جارٍ إنشاء الحساب...' : 'إنشاء الحساب' }}
    </button>

    <p class="auth-form__switch">
      عندك حساب بالفعل؟
      <a
        [routerLink]="loginPath"
        [queryParams]="{ returnUrl: route.snapshot.queryParamMap.get('returnUrl') }"
        >سجل الدخول</a
      >
    </p>
  </form>
</app-auth-shell>
