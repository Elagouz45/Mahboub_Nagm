<app-auth-shell title="تسجيل الدخول" lead="ادخل بياناتك لمتابعة طلباتك وحسابك.">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (showDemo) {
      <aside class="demo-box" aria-label="حساب تجريبي">
        <p>حساب تجريبي للمعاينة المحلية فقط</p>
        <p>
          <span>{{ demoEmail }}</span>
          <span>{{ demoPassword }}</span>
        </p>
        <button type="button" (click)="fillDemo()">تعبئة البيانات</button>
      </aside>
    }

    @if (formError()) {
      <p class="auth-form__error" role="alert" aria-live="assertive">{{ formError() }}</p>
    }
    @if (forgotNotice()) {
      <p class="auth-form__notice" role="status" aria-live="polite">{{ forgotNotice() }}</p>
    }

    <label [class.is-invalid]="fieldInvalid('identifier')">
      <span>البريد الإلكتروني أو رقم الهاتف</span>
      <input
        id="login-identifier"
        type="text"
        formControlName="identifier"
        autocomplete="username"
        inputmode="email"
        [attr.aria-invalid]="fieldInvalid('identifier')"
        [attr.aria-describedby]="fieldInvalid('identifier') ? 'login-identifier-error' : null"
      />
      @if (fieldInvalid('identifier')) {
        <small id="login-identifier-error">أدخل بريدًا إلكترونيًا صحيحًا أو رقم هاتف مصريًا.</small>
      }
    </label>

    <label [class.is-invalid]="fieldInvalid('password')">
      <span>كلمة المرور</span>
      <span class="password-field">
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="fieldInvalid('password')"
          [attr.aria-describedby]="fieldInvalid('password') ? 'login-password-error' : null"
        />
        <button type="button" (click)="togglePassword()" [attr.aria-label]="showPassword() ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'">
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
        </button>
      </span>
      @if (fieldInvalid('password')) {
        <small id="login-password-error">كلمة المرور مطلوبة.</small>
      }
    </label>

    <div class="auth-form__row">
      <label class="check-row">
        <input type="checkbox" formControlName="rememberMe" />
        <span>تذكرني</span>
      </label>
      <button type="button" class="auth-form__link" (click)="onForgotPassword()">نسيت كلمة المرور؟</button>
    </div>

    <button type="submit" class="auth-form__submit" [disabled]="submitting()">
      {{ submitting() ? 'جارٍ الدخول...' : 'تسجيل الدخول' }}
    </button>

    <p class="auth-form__switch">
      ليس لديك حساب؟
      <a [routerLink]="registerPath" [queryParams]="{ returnUrl: route.snapshot.queryParamMap.get('returnUrl') }"
        >أنشئ حسابًا</a
      >
    </p>
  </form>
</app-auth-shell>
