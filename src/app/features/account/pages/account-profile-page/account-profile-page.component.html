<section class="profile" aria-labelledby="profile-heading">
  <h1 id="profile-heading">الملف الشخصي</h1>
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    @if (formError()) {
      <p class="error" role="alert">{{ formError() }}</p>
    }
    <label>
      <span>الاسم الأول</span>
      <input type="text" formControlName="firstName" autocomplete="given-name" [attr.aria-invalid]="fieldInvalid('firstName')" />
      @if (fieldInvalid('firstName')) {
        <small>الاسم الأول مطلوب.</small>
      }
    </label>
    <label>
      <span>اسم العائلة</span>
      <input type="text" formControlName="lastName" autocomplete="family-name" [attr.aria-invalid]="fieldInvalid('lastName')" />
      @if (fieldInvalid('lastName')) {
        <small>اسم العائلة مطلوب.</small>
      }
    </label>
    <label>
      <span>رقم الهاتف</span>
      <input type="tel" formControlName="phone" autocomplete="tel" inputmode="tel" [attr.aria-invalid]="fieldInvalid('phone')" />
      @if (fieldInvalid('phone')) {
        <small>{{ form.controls.phone.hasError('duplicate') ? 'رقم الهاتف مسجّل بالفعل.' : 'أدخل رقمًا مصريًا صحيحًا.' }}</small>
      }
    </label>
    <label>
      <span>البريد الإلكتروني</span>
      <input type="email" formControlName="email" autocomplete="email" inputmode="email" [attr.aria-invalid]="fieldInvalid('email')" />
      @if (fieldInvalid('email')) {
        <small>{{ form.controls.email.hasError('duplicate') ? 'هذا البريد الإلكتروني مسجّل بالفعل.' : 'أدخل بريدًا إلكترونيًا صحيحًا.' }}</small>
      }
    </label>
    <button type="submit" [disabled]="form.pristine || form.invalid || saving()">
      {{ saving() ? 'جارٍ الحفظ...' : 'حفظ التغييرات' }}
    </button>
  </form>
</section>
