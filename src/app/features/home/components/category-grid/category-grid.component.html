<section class="categories page-container" aria-labelledby="categories-heading">
  <app-section-header
    title="الأقسام"
    headingId="categories-heading"
    actionLabel="عرض الكل"
    actionLink="/products"
  >
    <app-icon name="grid" />
  </app-section-header>

  @switch (state().status) {
    @case ('loading') {
      <div class="categories__grid">
        @for (item of skeletonItems; track item) {
          <div class="skeleton-card"></div>
        }
      </div>
    }
    @case ('empty') {
      <app-empty-state title="لا توجد أقسام حالياً" description="سيتم عرض الأقسام عند توفرها." />
    }
    @case ('error') {
      <app-error-state [message]="state().error ?? ''" (retry)="retry.emit()" />
    }
    @default {
      <div class="categories__grid">
        @for (category of state().data; track category.id) {
          <a
            class="category-card"
            [routerLink]="['/products']"
            [queryParams]="{ category: category.slug }"
          >
            <span class="category-card__media">
              <app-site-image
                [src]="category.imageSrc"
                [alt]="category.imageAlt"
                [decorative]="true"
                [fill]="true"
                objectFit="contain"
                sizes="(max-width: 480px) 28vw, (max-width: 768px) 18vw, 10vw"
              />
            </span>
            <span class="category-card__name">{{ category.name }}</span>
          </a>
        }
      </div>
    }
  }
</section>
