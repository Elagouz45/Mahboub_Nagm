@if (loading()) {
  <ul class="product-grid" [class.product-grid--list]="view() === 'list'" aria-hidden="true">
    @for (item of skeletons(); track item) {
      <li>
        <app-product-card [skeleton]="true" [layout]="view()" />
      </li>
    }
  </ul>
} @else {
  <ul class="product-grid" [class.product-grid--list]="view() === 'list'">
    @for (product of products(); track product.id + '-' + view()) {
      <li>
        <app-product-card [product]="product" [layout]="view()" />
      </li>
    }
  </ul>
}
