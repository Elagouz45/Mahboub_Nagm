@if (fill()) {
  @if (priority()) {
    <img
      class="site-image"
      [ngSrc]="displayAsset().src"
      [alt]="displayAlt()"
      fill
      priority
      [sizes]="sizes()"
      [disableOptimizedSrcset]="true"
      decoding="async"
      [style.object-fit]="objectFit()"
      [style.object-position]="objectPosition()"
      (error)="onImageError()"
    />
  } @else {
    <img
      class="site-image"
      [ngSrc]="displayAsset().src"
      [alt]="displayAlt()"
      fill
      loading="lazy"
      [sizes]="sizes()"
      [disableOptimizedSrcset]="true"
      decoding="async"
      [style.object-fit]="objectFit()"
      [style.object-position]="objectPosition()"
      (error)="onImageError()"
    />
  }
} @else if (priority()) {
  <img
    class="site-image"
    [ngSrc]="displayAsset().src"
    [alt]="displayAlt()"
    [width]="displayAsset().width"
    [height]="displayAsset().height"
    priority
    [sizes]="sizes()"
    [disableOptimizedSrcset]="true"
    decoding="async"
    [style.object-fit]="objectFit()"
    [style.object-position]="objectPosition()"
    (error)="onImageError()"
  />
} @else {
  <img
    class="site-image"
    [ngSrc]="displayAsset().src"
    [alt]="displayAlt()"
    [width]="displayAsset().width"
    [height]="displayAsset().height"
    loading="lazy"
    [sizes]="sizes()"
    [disableOptimizedSrcset]="true"
    decoding="async"
    [style.object-fit]="objectFit()"
    [style.object-position]="objectPosition()"
    (error)="onImageError()"
  />
}
