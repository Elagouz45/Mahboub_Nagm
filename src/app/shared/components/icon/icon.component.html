<svg
  class="app-icon"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  [class.app-icon--labelled]="!!label()"
  [class.app-icon--filled]="filled()"
>
  @switch (name()) {
    @case ('search') {
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    }
    @case ('cart') {
      <path d="M6 6h15l-1.5 9h-12z" />
      <path d="M6 6 5 3H2" />
      <circle cx="9" cy="20" r="1.3" />
      <circle cx="17" cy="20" r="1.3" />
    }
    @case ('heart') {
      <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.6-7 10-7 10Z" />
    }
    @case ('user') {
      <circle cx="12" cy="8" r="3.2" />
      <path d="M5 19a7 7 0 0 1 14 0" />
    }
    @case ('menu') {
      <path d="M4 7h16M4 12h16M4 17h16" />
    }
    @case ('close') {
      <path d="M6 6l12 12M18 6 6 18" />
    }
    @case ('check') {
      <path d="m5 12 5 5 9-9" />
    }
    @case ('star') {
      <path
        fill="currentColor"
        stroke="none"
        d="M12 3.6 14.5 9l6 .5-4.6 3.8 1.5 5.8L12 16.2 6.6 19.1 8.1 13.3 3.5 9.5 9.5 9z"
      />
    }
    @case ('star-outline') {
      <path d="M12 3.6 14.5 9l6 .5-4.6 3.8 1.5 5.8L12 16.2 6.6 19.1 8.1 13.3 3.5 9.5 9.5 9z" />
    }
    @case ('whatsapp') {
      <path
        d="M20 11.5A8.5 8.5 0 0 1 7.2 18.8L4 20l1.3-3.1A8.5 8.5 0 1 1 20 11.5Z"
      />
      <path d="M9.2 9.4c.2-.5.4-.5.7-.5h.6c.2 0 .4.1.5.4l.7 1.6c.1.2 0 .4-.1.6l-.4.5c-.2.2-.2.4 0 .6 1 1.4 2.3 2.2 3.6 2.8.3.1.5.1.7-.1l.6-.7c.2-.2.4-.2.6-.1l1.7.7c.3.1.4.3.4.5v.6c0 .3 0 .5-.5.7A4.7 4.7 0 0 1 15 17.4c-2.4 0-5-1.6-6.6-4.3-.6-1-.8-2 0-3.7Z" />
    }
    @case ('bag') {
      <path d="M6 8h12l-1 12H7L6 8Z" />
      <path d="M9 8a3 3 0 0 1 6 0" />
    }
    @case ('shield') {
      <path d="M12 3 5 6v6c0 4 3 6.5 7 8 4-1.5 7-4 7-8V6l-7-3Z" />
      <path class="app-icon__accent" d="m9 12 2 2 4-4" />
    }
    @case ('certificate') {
      <rect x="5" y="3" width="11.5" height="16.5" rx="1.6" />
      <path d="M8 8h6M8 11.2h6M8 14.4h3.4" />
      <circle class="app-icon__accent" cx="16.6" cy="15.2" r="3.1" />
      <path class="app-icon__accent" d="M15.1 17.8v3.2l1.5-1 1.5 1v-3.2" />
    }
    @case ('truck') {
      <path d="M3 7h11v10H3z" />
      <path d="M14 10h4l3 3v4h-7" />
      <circle cx="7.5" cy="17.5" r="1.5" />
      <circle cx="17.5" cy="17.5" r="1.5" />
    }
    @case ('truck-fast') {
      <path class="app-icon__accent" d="M18.8 8.5h3.2M19.6 12h2.4M18.8 15.5h3.2" />
      <path d="M8.8 7.2h8.2v8.6H8.8z" />
      <path d="M8.8 10.2H5.6L3 13v2.8h5.8" />
      <circle cx="14.6" cy="16.4" r="1.45" />
      <circle cx="6.4" cy="16.4" r="1.45" />
    }
    @case ('badge-check') {
      <circle cx="12" cy="12" r="8" />
      <path d="m8.5 12 2.3 2.3 4.7-4.7" />
    }
    @case ('headset') {
      <path d="M4 13v-1a8 8 0 0 1 16 0v1" />
      <path d="M4 13v4h3v-5H4Zm13 0v5h3v-4h-3Z" />
      <path d="M17 18v1a2 2 0 0 1-2 2h-2" />
    }
    @case ('headset-whatsapp') {
      <path d="M4.5 13.4v-1.2a7.5 7.5 0 0 1 15 0v1.2" />
      <rect x="4.5" y="12.2" width="3" height="5.6" rx="1.1" />
      <rect x="16.5" y="12.2" width="3" height="5.6" rx="1.1" />
      <path d="M16.6 18.6v.7a2.1 2.1 0 0 1-2.1 2.1h-1.7" />
      <g transform="translate(12 12.4) scale(0.36) translate(-12 -11.5)">
        <path
          class="app-icon__whatsapp"
          d="M20 11.5A8.5 8.5 0 0 1 7.2 18.8L4 20l1.3-3.1A8.5 8.5 0 1 1 20 11.5Z"
        />
      </g>
    }
    @case ('bolt') {
      <path fill="currentColor" stroke="none" d="M13 2 4 14h7l-1 8 10-14h-7l0-6Z" />
    }
    @case ('flame') {
      <path
        fill="currentColor"
        stroke="none"
        d="M12 3c0 3.4-2.2 5.4-3.4 7.4A4.8 4.8 0 1 0 16.7 14c0-2.3-1-3.8-2.2-5.6 1.7.8 3.5 2.6 3.8 5.3A6.6 6.6 0 1 1 8.4 7.6C9.8 6 11.3 4.4 12 3Z"
      />
    }
    @case ('crown') {
      <path d="M4 16.5 6.2 8.5 10.2 12 12 6l1.8 6 4-3.5 2.2 8Z" />
      <path d="M5 19.5h14" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="8" />
      <path d="M12 8v4.5L15 14" />
    }
    @case ('chevron-down') {
      <path d="m6 9 6 6 6-6" />
    }
    @case ('chevron-next') {
      <path d="m14 6-6 6 6 6" />
    }
    @case ('chevron-prev') {
      <path d="m10 6 6 6-6 6" />
    }
    @case ('grid') {
      <rect x="3" y="3" width="7" height="7" rx="1" />
      <rect x="14" y="3" width="7" height="7" rx="1" />
      <rect x="3" y="14" width="7" height="7" rx="1" />
      <rect x="14" y="14" width="7" height="7" rx="1" />
    }
    @case ('list') {
      <path d="M8 6h13M8 12h13M8 18h13" />
      <circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none" />
      <circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none" />
      <circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none" />
    }
    @case ('facebook') {
      <path d="M14 8h3V5h-3c-2.2 0-4 1.8-4 4v2H8v3h2v6h3v-6h2.4l.6-3H13V9c0-.6.4-1 1-1Z" />
    }
    @case ('instagram') {
      <rect x="4" y="4" width="16" height="16" rx="4" />
      <circle cx="12" cy="12" r="3.2" />
      <circle cx="16.8" cy="7.2" r="0.8" fill="currentColor" stroke="none" />
    }
    @case ('youtube') {
      <path d="M21 8.2a3 3 0 0 0-2.1-2.1C17 5.6 12 5.6 12 5.6s-5 0-6.9.5A3 3 0 0 0 3 8.2 31 31 0 0 0 3 12a31 31 0 0 0 .1 3.8 3 3 0 0 0 2.1 2.1c1.9.5 6.9.5 6.9.5s5 0 6.9-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 21 12a31 31 0 0 0 0-3.8Z" />
      <path fill="currentColor" stroke="none" d="M10.5 15.2V8.8L15.8 12z" />
    }
    @case ('phone') {
      <path d="M7 3h4l1 4-2 1.5a12 12 0 0 0 5.5 5.5L17 12l4 1v4a2 2 0 0 1-2 2A16 16 0 0 1 5 7a2 2 0 0 1 2-2Z" />
    }
    @case ('mail') {
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="m4 7 8 6 8-6" />
    }
    @case ('send') {
      <path d="M4 12 20 4 13 20l-2-7z" />
    }
    @case ('wrench') {
      <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4L16 11l-3-3z" />
    }
    @case ('package') {
      <path d="M21 8 12 3 3 8v8l9 5 9-5z" />
      <path d="M12 13V3M3 8l9 5 9-5" />
    }
    @case ('lock') {
      <rect x="5" y="11" width="14" height="10" rx="2" />
      <path d="M8 11V8a4 4 0 0 1 8 0v3" />
    }
    @case ('message') {
      <path d="M4 5h16v11H8l-4 3z" />
    }
    @case ('sliders') {
      <path d="M4 8h16M4 16h16" />
      <circle cx="9" cy="8" r="2.1" />
      <circle cx="15" cy="16" r="2.1" />
    }
    @case ('appliance') {
      <rect x="5" y="3.5" width="14" height="17" rx="2" />
      <path d="M8 8h8M8 12h5" />
      <circle cx="16" cy="16.5" r="0.9" fill="currentColor" stroke="none" />
    }
    @case ('tv') {
      <rect x="3" y="5" width="18" height="12" rx="2" />
      <path d="M8 21h8M12 17v4" />
    }
    @case ('snowflake') {
      <path d="M12 3v18M5.5 7.5 18.5 16.5M18.5 7.5 5.5 16.5" />
      <path d="M9 5.2 12 3l3 2.2M9 18.8 12 21l3-2.2" />
    }
    @case ('map-pin') {
      <path d="M12 21s-7-5.4-7-11a7 7 0 0 1 14 0c0 5.6-7 11-7 11Z" />
      <circle cx="12" cy="10" r="2.4" />
    }
    @case ('external-link') {
      <path d="M14 5h5v5" />
      <path d="M10 14 19 5" />
      <path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" />
    }
    @case ('layout') {
      <rect x="3" y="3" width="8" height="8" rx="1.5" />
      <rect x="13" y="3" width="8" height="5" rx="1.5" />
      <rect x="13" y="10" width="8" height="11" rx="1.5" />
      <rect x="3" y="13" width="8" height="8" rx="1.5" />
    }
    @case ('log-out') {
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <path d="m16 17 5-5-5-5" />
      <path d="M21 12H9" />
    }
    @case ('eye') {
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
      <circle cx="12" cy="12" r="3" />
    }
    @case ('eye-off') {
      <path d="M3 3l18 18" />
      <path d="M10.6 10.6A3 3 0 0 0 13.4 13.4" />
      <path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-4.4 4.8" />
      <path d="M6.1 6.1C3.8 7.8 2.3 10.2 2 12c0 0 3.5 7 10 7 1.6 0 3.1-.4 4.4-1" />
    }
    @case ('home') {
      <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" />
    }
    @case ('plus') {
      <path d="M12 5v14M5 12h14" />
    }
  }
</svg>
@if (label()) {
  <span class="visually-hidden">{{ label() }}</span>
}
